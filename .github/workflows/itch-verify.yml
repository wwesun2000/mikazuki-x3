name: Verify itch credentials (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: itch-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check account and draft access without upload
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python -B tools/verify_itch_access.py
